metadata:
  name: opentelemetry-demo-jaeger-query
  namespace: jaeger
spec:
  type: ClusterIP
  selector:
    app: opentelemetry-demo-jaeger
  ports:
    - name: query
      port: 16686
      targetPort: 16686
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-jaeger-collector
  namespace: jaeger
spec:
  type: ClusterIP
  selector:
    app: opentelemetry-demo-jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-prometheus-config
  namespace: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: [opentelemetry-demo-otelcol.otelcol.svc.cluster.local:8888, opentelemetry-demo-otelcol.otelcol.svc.cluster.local:8889]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-prometheus
  namespace: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry-demo-prometheus
  template:
    metadata:
      labels:
        app: opentelemetry-demo-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: opentelemetry-demo-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-prometheus
  namespace: prometheus
spec:
  type: ClusterIP
  selector:
    app: opentelemetry-demo-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-grafana-datasources
  namespace: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: webstore-metrics
        type: prometheus
        url: http://opentelemetry-demo-prometheus.prometheus.svc.cluster.local:9090
        access: proxy
        isDefault: true
      - name: Jaeger
        uid: webstore-traces
        type: jaeger
        url: http://opentelemetry-demo-jaeger-query.jaeger.svc.cluster.local:16686/jaeger
        access: proxy
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-grafana
  namespace: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opentelemetry-demo-grafana
  template:
    metadata:
      labels:
        app: opentelemetry-demo-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SERVER_ROOT_URL
              value: "http://astronamy-shop-sudha-demo.eastus.cloudapp.azure.com:8080/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: Viewer
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: datasources
          configMap:
            name: opentelemetry-demo-grafana-datasources
        - name: dashboards
          configMap:
            name: opentelemetry-demo-grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-grafana
  namespace: grafana
spec:
  type: ClusterIP
  selector:
    app: opentelemetry-demo-grafana
  ports:
    - name: http
      port: 80
      targetPort: 3000
