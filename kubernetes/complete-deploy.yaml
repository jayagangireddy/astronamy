apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-investigator
  labels:
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: investigator
    app.kubernetes.io/name: opentelemetry-demo-investigator
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-demo-investigator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: investigator
        app.kubernetes.io/name: opentelemetry-demo-investigator
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      containers:
        - name: investigator
          image: nginxinc/nginx-unprivileged:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ui
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
        - name: ui
          configMap:
            name: opentelemetry-demo-investigator-ui
        - name: nginx-config
          configMap:
            name: opentelemetry-demo-investigator-ui
            items:
              - key: nginx.conf
                path: nginx.conf

