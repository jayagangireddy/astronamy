apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-frontendproxy-config
  labels:
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: frontendproxy
    app.kubernetes.io/part-of: opentelemetry-demo
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    tracing:
                      spawn_upstream_span: true
                      provider:
                        name: envoy.tracers.opentelemetry
                        typed_config:
                          "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                          grpc_service:
                            envoy_grpc: { cluster_name: opentelemetry_collector_grpc }
                            timeout: 0.250s
                          service_name: frontendproxy
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: frontend
                          domains: ["*"]
                          routes:
                            - match: { prefix: "/api/" }
                              route: { cluster: investigator_api }
                            - match: { prefix: "/investigator/" }
                              route: { cluster: investigator, prefix_rewrite: "/" }
                            - match: { path: "/investigator" }
                              redirect: { path_redirect: "/investigator/" }
                            - match: { prefix: "/loadgen" }
                              route: { cluster: loadgen, prefix_rewrite: "/" }
                            - match: { prefix: "/otlp-http/" }
                              route: { cluster: opentelemetry_collector_http, prefix_rewrite: "/" }
                            - match: { prefix: "/jaeger" }
                              route: { cluster: jaeger }
                            - match: { prefix: "/grafana" }
                              route: { cluster: grafana }
                            - match: { prefix: "/images/" }
                              route: { cluster: image-provider, prefix_rewrite: "/" }
                            - match: { prefix: "/flagservice/" }
                              route: { cluster: flagservice, prefix_rewrite: "/", timeout: 0s }
                            - match: { prefix: "/feature" }
                              route: { cluster: flagd-ui }
                            - match: { prefix: "/" }
                              route: { cluster: frontend }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: opentelemetry_collector_grpc
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: opentelemetry_collector_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-otelcol, port_value: 4317 }
        - name: opentelemetry_collector_http
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: opentelemetry_collector_http
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-otelcol, port_value: 4318 }
        - name: investigator
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: investigator
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-investigator, port_value: 8080 }
        - name: investigator_api
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: investigator_api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-investigator-api, port_value: 8080 }
        - name: frontend
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: frontend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-frontend, port_value: 8080 }
        - name: image-provider
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: image-provider
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-imageprovider, port_value: 8081 }
        - name: flagservice
          type: STRICT_DNS
          connect_timeout: 5s
