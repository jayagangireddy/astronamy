apiVersion: v1
kind: ConfigMap
metadata:
  name: opentelemetry-demo-frontendproxy-config
  namespace: frontendproxy
  labels:
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: frontendproxy
    app.kubernetes.io/part-of: opentelemetry-demo
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: ingress
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    codec_type: AUTO
                    tracing:
                      spawn_upstream_span: true
                      provider:
                        name: envoy.tracers.opentelemetry
                        typed_config:
                          "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                          grpc_service:
                            envoy_grpc: { cluster_name: opentelemetry_collector_grpc }
                            timeout: 0.250s
                          service_name: frontendproxy
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: frontend
                          domains: ["*"]
                          routes:
                            - match: { path: "/mcp" }
                              route:
                                cluster: kube_investigator_mcp
                                timeout: 0s
                                idle_timeout: 0s
                            - match: { prefix: "/investigator-api/" }
                              route: { cluster: investigator_api, prefix_rewrite: "/api/" }
                            - match: { prefix: "/investigator/" }
                              route: { cluster: investigator, prefix_rewrite: "/" }
                            - match: { path: "/investigator" }
                              redirect: { path_redirect: "/investigator/" }
                            - match: { prefix: "/loadgen" }
                              route: { cluster: loadgen, prefix_rewrite: "/" }
                            - match: { prefix: "/otlp-http/" }
                              route: { cluster: opentelemetry_collector_http, prefix_rewrite: "/" }
                            - match: { prefix: "/jaeger" }
                              route: { cluster: jaeger }
                            - match: { prefix: "/grafana" }
                              route: { cluster: grafana }
                            - match: { prefix: "/images/" }
                              route: { cluster: image-provider, prefix_rewrite: "/" }
                            - match: { prefix: "/flagservice/" }
                              route: { cluster: flagservice, prefix_rewrite: "/", timeout: 0s }
                            - match: { prefix: "/feature" }
                              route: { cluster: flagd-ui }
                            - match: { prefix: "/" }
                              route: { cluster: frontend }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: opentelemetry_collector_grpc
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: opentelemetry_collector_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-otelcol.otelcol.svc.cluster.local, port_value: 4317 }
        - name: opentelemetry_collector_http
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: opentelemetry_collector_http
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-otelcol.otelcol.svc.cluster.local, port_value: 4318 }
        - name: kube_investigator_mcp
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: kube_investigator_mcp
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: kube-investigator-mcp.kube-investigator.svc.cluster.local, port_value: 8000 }
        - name: investigator
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: investigator
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-investigator.investigator.svc.cluster.local, port_value: 8080 }
        - name: investigator_api
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: investigator_api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-investigator-api.investigator-api.svc.cluster.local, port_value: 8080 }
        - name: frontend
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: frontend
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-frontend.frontend.svc.cluster.local, port_value: 8080 }
        - name: image-provider
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: image-provider
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-imageprovider.imageprovider.svc.cluster.local, port_value: 8081 }
        - name: flagservice
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: flagservice
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-flagd.flagd.svc.cluster.local, port_value: 8013 }
        - name: flagd-ui
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: flagd-ui
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-flagd.flagd.svc.cluster.local, port_value: 4000 }
        - name: loadgen
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: loadgen
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-loadgenerator.loadgenerator.svc.cluster.local, port_value: 8089 }
        - name: grafana
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: grafana
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-grafana.grafana.svc.cluster.local, port_value: 80 }
        - name: jaeger
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: jaeger
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: opentelemetry-demo-jaeger-query.jaeger.svc.cluster.local, port_value: 16686 }
    admin:
      address:
        socket_address: { address: 127.0.0.1, port_value: 10000 }
