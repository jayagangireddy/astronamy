apiVersion: v1
kind: ServiceAccount
metadata:
  name: opentelemetry-demo-investigator-api
  namespace: investigator-api
  labels:
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: investigator-api
    app.kubernetes.io/name: opentelemetry-demo-investigator-api
    app.kubernetes.io/part-of: opentelemetry-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opentelemetry-demo-investigator-api
  labels:
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: investigator-api
    app.kubernetes.io/name: opentelemetry-demo-investigator-api
    app.kubernetes.io/part-of: opentelemetry-demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opentelemetry-demo-investigator-api
  labels:
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: investigator-api
    app.kubernetes.io/name: opentelemetry-demo-investigator-api
    app.kubernetes.io/part-of: opentelemetry-demo
subjects:
  - kind: ServiceAccount
    name: opentelemetry-demo-investigator-api
    namespace: investigator-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opentelemetry-demo-investigator-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opentelemetry-demo-investigator-api
  namespace: investigator-api
  labels:
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: investigator-api
    app.kubernetes.io/name: opentelemetry-demo-investigator-api
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-demo-investigator-api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: opentelemetry-demo
        app.kubernetes.io/component: investigator-api
        app.kubernetes.io/name: opentelemetry-demo-investigator-api
        app.kubernetes.io/part-of: opentelemetry-demo
    spec:
      serviceAccountName: opentelemetry-demo-investigator-api
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "/app/server.py"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: api-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: api-code
          configMap:
            name: opentelemetry-demo-investigator-api
---
apiVersion: v1
kind: Service
metadata:
  name: opentelemetry-demo-investigator-api
  namespace: investigator-api
  labels:
    app.kubernetes.io/instance: opentelemetry-demo
    app.kubernetes.io/component: investigator-api
    app.kubernetes.io/name: opentelemetry-demo-investigator-api
    app.kubernetes.io/part-of: opentelemetry-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opentelemetry-demo-investigator-api
  ports:
    - name: http
      port: 8080
      targetPort: http
